# Herdr config — Ghostty + KDE, Tokyo Night, multi-agent
onboarding = false

[theme]
name = "tokyo-night"
auto_switch = true
dark_name = "tokyo-night"
light_name = "tokyo-night-day"

# No [theme.custom] / ui.accent overrides: those tokens are Night-specific
# and would stick after auto_switch moves to tokyo-night-day.

[terminal]
# Inherit CWD from the source pane/workspace (best for agent splits).
new_cwd = "follow"

[worktrees]
# Git worktree checkouts from the sidebar land here.
directory = "~/.herdr/worktrees"

[keys]
# ctrl+s as prefix (free up ctrl+b). Note: shells/editors may also use ctrl+s.
prefix = "ctrl+s"
# Keep prefix bindings, add direct ctrl+alt chords (safe on Ghostty).
# Avoid ctrl+alt+l (KDE lock) and ctrl+alt+t (Fedora launch terminal).
focus_pane_left = ["prefix+h", "ctrl+alt+h"]
focus_pane_down = ["prefix+j", "ctrl+alt+j"]
focus_pane_up = ["prefix+k", "ctrl+alt+k"]
focus_pane_right = ["prefix+l", "ctrl+alt+;"]
previous_tab = ["prefix+p", "ctrl+alt+["]
next_tab = ["prefix+n", "ctrl+alt+]"]
new_tab = ["prefix+c", "ctrl+alt+c"]
split_vertical = ["prefix+v", "ctrl+alt+d"]
split_horizontal = ["prefix+minus", "ctrl+alt+shift+d"]
zoom = ["prefix+z", "ctrl+alt+z"]
toggle_sidebar = ["prefix+b", "ctrl+alt+b"]
workspace_picker = ["prefix+w", "ctrl+alt+w"]
last_pane = "prefix+;"
switch_workspace = "prefix+shift+1..9"
focus_agent = "prefix+alt+1..9"
previous_agent = "prefix+["
next_agent = "prefix+]"

[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
description = "lazygit"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+alt+t"
type = "popup"
command = "btop"
description = "btop"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+t"
type = "popup"
command = "exec \"${SHELL:-bash}\""
description = "scratch terminal"
width = "80%"
height = "80%"

[ui]
show_agent_labels_on_pane_borders = true
hide_tab_bar_when_single_tab = true
# Attention queue: blocked/done agents float up across workspaces.
agent_panel_sort = "priority"
# Less flash when alt-tabbing back into Ghostty on Plasma.
redraw_on_focus_gained = false
# Keep Herdr mouse UI; set false if you need Ghostty click-open URLs more often.
mouse_capture = true
copy_on_select = true
pane_borders = true
pane_gaps = true

[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", "workspace", "tab"],
  ["agent", "state_text"],
]

[ui.sidebar.agents.rows_by_agent]
cursor = [
  ["state_icon", "workspace", "tab"],
  ["terminal_title_stripped"],
  ["agent", "state_text"],
]
codex = [
  ["state_icon", "workspace", "tab"],
  ["terminal_title_stripped"],
  ["agent", "state_text"],
]
opencode = [
  ["state_icon", "workspace", "tab"],
  ["terminal_title_stripped"],
  ["agent", "state_text"],
]

[ui.sidebar.spaces]
row_gap = 0
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
]

[ui.toast]
# Ghostty can surface these as desktop notifications.
delivery = "terminal"
delay_seconds = 1

[ui.sound]
# Ping when a background agent finishes or needs input.
enabled = true

[session]
resume_agents_on_restore = true

[experimental]
# Ghostty speaks Kitty graphics; useful for agent image pastes.
kitty_graphics = true
# Off by default: persists recent pane screen contents across server restarts.
# Enable only if you want crash/restart continuity and accept that trade-off.
pane_history = false

[advanced]
# Match Ghostty's default scrollback budget.
scrollback_limit_bytes = 10000000
