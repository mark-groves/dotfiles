---
# Fedora package names implementing the portable developer workstation profile.
fedora_base_packages:
  - git
  - git-lfs
  - gh
  - stow
  - tmux
  - ripgrep
  - fd-find
  - fzf
  - bat
  - jq
  - yq
  - direnv
  - ShellCheck
  - shfmt
  - wl-clipboard

fedora_build_packages:
  - gcc
  - gcc-c++
  - make
  - clang
  - clang-tools-extra
  - cmake
  - ninja-build
  - pkgconf-pkg-config
  - openssl-devel
  - gdb
  - lldb

fedora_language_packages:
  - neovim
  - golang
  - nodejs22
  - nodejs22-bin
  - nodejs22-npm
  - nodejs22-npm-bin
  - python3
  - python3-pip
  - uv
  - rustup

fedora_container_packages:
  - podman
  - buildah
  - podman-compose

fedora_desktop_packages:
  - ghostty
  - cursor
  - 1password
  - 1password-cli

nerd_font_version: "3.4.0"
nerd_font_jetbrains_mono_sha256: "76f05ff3ace48a464a6ca57977998784ff7bdbb65a6d915d7e401cd3927c493c"
pnpm_version: "11.11.0"
starship_version: "1.26.0"
starship_release_base_url: https://github.com/starship/starship/releases/download
starship_targets:
  x86_64: x86_64-unknown-linux-musl
  aarch64: aarch64-unknown-linux-musl

