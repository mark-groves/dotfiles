# Workspace assignment is loaded from state so the monitor watcher can update
# it without writing through stowed config symlinks.
#
# Laptop-only: workspaces 1-9 are assigned to the laptop panel.
# Docked with the laptop panel active: workspaces 1-6 go to the external display,
# while 7-9 stay on the laptop panel.
source = ~/.local/state/omarchy/hypr/workspaces/*.conf
